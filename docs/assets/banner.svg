<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="InjectRange banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f12"/>
      <stop offset="1" stop-color="#241317"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05d6f"/>
      <stop offset="1" stop-color="#b83b4d"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" fill="url(#bg)"/>
  <g stroke="#33191f" stroke-width="1">
    <path d="M0 65 H960 M0 130 H960 M0 195 H960 M240 0 V260 M480 0 V260 M720 0 V260"/>
  </g>
  <text x="48" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fdeef1">InjectRange</text>
  <text x="48" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#cf9aa5">six breach classes against a pinned probe corpus, measured per guard</text>
  <g transform="translate(48 150)">
    <line x1="0" y1="28" x2="300" y2="28" stroke="#4a2730" stroke-width="2"/>
    <rect x="196" y="0" width="8" height="56" rx="3" fill="url(#guard)"/>
    <g fill="#c9b0b6">
      <circle cx="24" cy="16" r="4"/><circle cx="60" cy="40" r="4"/>
      <circle cx="96" cy="14" r="4"/><circle cx="132" cy="42" r="4"/>
      <circle cx="168" cy="18" r="4"/>
    </g>
    <circle cx="228" cy="30" r="5" fill="#e05d6f"/>
    <text x="244" y="35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e0a3ab">breach</text>
    <text x="0" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a1737d">probes</text>
    <text x="196" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a1737d">guard</text>
  </g>
  <g transform="translate(560 60)">
    <text x="0" y="0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b07f89">classes</text>
    <text x="0" y="24" font-family="Consolas, Menlo, monospace" font-size="13" fill="#f2dfe3">override | confusion | escape</text>
    <text x="0" y="46" font-family="Consolas, Menlo, monospace" font-size="13" fill="#f2dfe3">smuggling | coercion | framing</text>
    <text x="0" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b07f89">corpus</text>
    <text x="0" y="98" font-family="Consolas, Menlo, monospace" font-size="13" fill="#f2dfe3">pinned by hash, mismatch is an error</text>
    <text x="0" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b07f89">exit codes</text>
    <text x="0" y="150" font-family="Consolas, Menlo, monospace" font-size="13" fill="#f2dfe3">0 clean | 1 findings | 2 usage</text>
  </g>
</svg>
