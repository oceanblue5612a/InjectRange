<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img"
     aria-labelledby="mxTitle mxDesc" width="520" height="340">
  <!--
    Palette reason: this graphic reports two guard states, so two core colours
    carry meaning. Blocked green #2f7d5b marks a class the guard closed; breach
    red #b3402a is the accent and marks a class that leaked. Slate ink #1f2933
    is neutral for labels. Flat fills only, no gradient, no AI-default scheme.
    Numbers are the leaked count over total probes, taken from real CLI runs:
      injectrange run samples/guard-permissive.json
      injectrange run samples/guard-strict.json
    White text on both cell colours meets WCAG AA (4.99:1 green, 5.7:1 red).
  -->
  <title id="mxTitle">Breach matrix, permissive against strict guard</title>
  <desc id="mxDesc">Six breach classes by two guard configs. Each cell shows
    leaked over total probes and whether the class breached. The permissive
    guard breaches all six classes; the strict guard closes five and leaves
    delimiter escape open.</desc>

  <rect x="0" y="0" width="520" height="340" fill="#ffffff"/>

  <text x="16" y="28"
        font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
        font-size="16" font-weight="700" fill="#1f2933">Breach matrix: cell is leaked / total</text>

  <!-- Column headers -->
  <text x="300" y="64" text-anchor="middle"
