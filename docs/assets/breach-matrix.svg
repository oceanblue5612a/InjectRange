<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" role="img"
     aria-labelledby="mxTitle mxDesc" width="520" height="340">
  <!--
    Palette reason: this graphic reports two guard states, so two core colours
    carry meaning. Blocked green #2f7d5b marks a class the guard closed; breach
    red #b3402a is the accent and marks a class that leaked. Slate ink #1f2933
    is neutral for labels. Flat fills only, no gradient, no AI-default scheme.
    Numbers are the leaked count over total probes, taken from real CLI runs:
      injectrange run samples/guard-permissive.json
      injectrange run samples/guard-strict.json
    White text on both cell colours meets WCAG AA (4.99:1 green, 5.7:1 red).
  -->
  <title id="mxTitle">Breach matrix, permissive against strict guard</title>
  <desc id="mxDesc">Six breach classes by two guard configs. Each cell shows
    leaked over total probes and whether the class breached. The permissive
    guard breaches all six classes; the strict guard closes five and leaves
    delimiter escape open.</desc>

  <rect x="0" y="0" width="520" height="340" fill="#ffffff"/>

  <text x="16" y="28"
        font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'
        font-size="16" font-weight="700" fill="#1f2933">Breach matrix: cell is leaked / total</text>

  <!-- Column headers -->
  <text x="300" y="64" text-anchor="middle"
        font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace'
        font-size="12" font-weight="700" fill="#1f2933">permissive</text>
  <text x="404" y="64" text-anchor="middle"
        font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace'
        font-size="12" font-weight="700" fill="#1f2933">strict</text>

  <!-- Rows: y start 76, row height 36, cell width 88, gap 8 -->
  <!-- Row helper coordinates: permissive x=256, strict x=360, w=88, h=28 -->

  <!-- instruction_override: perm 3/4 breach, strict 0/4 closed -->
  <text x="16" y="94" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="12" fill="#1f2933">Instruction override</text>
  <rect x="256" y="78" width="88" height="28" rx="3" fill="#b3402a"/>
  <text x="300" y="96" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">3 / 4</text>
  <rect x="360" y="78" width="88" height="28" rx="3" fill="#2f7d5b"/>
  <text x="404" y="96" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">0 / 4</text>

  <!-- role_confusion: perm 3/4 breach, strict 0/4 closed -->
  <text x="16" y="130" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="12" fill="#1f2933">Role confusion</text>
  <rect x="256" y="114" width="88" height="28" rx="3" fill="#b3402a"/>
  <text x="300" y="132" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">3 / 4</text>
  <rect x="360" y="114" width="88" height="28" rx="3" fill="#2f7d5b"/>
  <text x="404" y="132" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">0 / 4</text>

  <!-- delimiter_escape: perm 4/4 breach, strict 4/4 breach -->
  <text x="16" y="166" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="12" fill="#1f2933">Delimiter escape</text>
  <rect x="256" y="150" width="88" height="28" rx="3" fill="#b3402a"/>
  <text x="300" y="168" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">4 / 4</text>
  <rect x="360" y="150" width="88" height="28" rx="3" fill="#b3402a"/>
  <text x="404" y="168" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">4 / 4</text>

  <!-- encoding_smuggling: perm 4/4 breach, strict 0/4 closed -->
  <text x="16" y="202" font-family='-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' font-size="12" fill="#1f2933">Encoding smuggling</text>
  <rect x="256" y="186" width="88" height="28" rx="3" fill="#b3402a"/>
  <text x="300" y="204" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">4 / 4</text>
  <rect x="360" y="186" width="88" height="28" rx="3" fill="#2f7d5b"/>
  <text x="404" y="204" text-anchor="middle" font-family='"Cascadia Mono", "JetBrains Mono", Consolas, "DejaVu Sans Mono", monospace' font-size="12" fill="#ffffff">0 / 4</text>

