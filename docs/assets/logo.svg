<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="logoTitle logoDesc" width="240" height="96">
  <!--
    Palette reason: the tool sorts injection probes into two states, blocked and
    breaching. Two core colours carry those states: slate ink #1f2933 for the
    "inject" morpheme (the incoming probe) and blocked green #2f7d5b for the
    "range" morpheme (the guard that holds). The single accent, breach red
    #b3402a, marks one probe that leaks past. Flat fills only. Not an AI-default
    scheme: no indigo, violet, cyan, or neon on black.
  -->
  <title id="logoTitle">injectrange</title>
  <desc id="logoDesc">Wordmark split at the inject and range morphemes, with one
    accent mark showing a single probe that breaches the guard.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

  <!-- Six probe ticks entering from the left, one breaches (accent). -->
  <g>
    <rect x="16" y="24" width="8" height="6" rx="3" fill="#1f2933"/>
