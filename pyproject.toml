[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "injectrange"
version = "1.0.0"
description = "Deterministic regression range for prompt-injection defences."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the injectrange authors" }]
keywords = ["prompt-injection", "regression", "guard", "corpus", "security"]

[project.scripts]
injectrange = "injectrange.cli:main"

[tool.setuptools]
